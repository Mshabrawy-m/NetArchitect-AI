# Streamlit configuration for NetArchitect AI.
# Clean, professional light theme with a muted engineering blue accent.

[server]
headless = true
# Application-level caps are 2,000,000 bytes for JSON and 1,000,000 for CSV.
# The widget is an outer guard; the in-app guarded parsers still enforce the
# smaller per-format caps and return typed errors before engine work begins.
maxUploadSize = 2

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2c5f8d"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f8"
textColor = "#1f2933"
