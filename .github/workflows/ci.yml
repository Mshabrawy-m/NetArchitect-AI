name: CI

on:
  push:
    branches: [main, feature/v2-tech]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Tests and lint - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Full test suite
        run: python -m pytest -q

      - name: Release smoke tests
        run: python -m pytest -q -m smoke

      - name: Deployment configuration check
        run: python -c "import tomllib,pathlib; c=tomllib.loads(pathlib.Path('.streamlit/config.toml').read_text(encoding='utf-8')); assert c['server']['headless'] is True; assert c['server']['maxUploadSize'] == 2; assert c['browser']['gatherUsageStats'] is False"

  runtime-only:
    name: Runtime-only install and Linux memory gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime requirements only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import importlib.util, sys; sys.exit('pytest must not be installed' if importlib.util.find_spec('pytest') else 0)"

      - name: Headless startup and all 15 pages
        run: python scripts/verify_runtime_only.py --port 8599 --timeout 90

      - name: Linux RSS budget
        run: python scripts/check_linux_memory.py

  audit:
    name: Dependency audit (throwaway venv)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create throwaway audit venv
        run: |
          python -m venv "${RUNNER_TEMP}/v2-audit-venv"
          "${RUNNER_TEMP}/v2-audit-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/v2-audit-venv/bin/python" -m pip install pip-audit

      - name: Audit runtime pins
        run: "${RUNNER_TEMP}/v2-audit-venv/bin/pip-audit -r requirements.txt --progress-spinner off"
