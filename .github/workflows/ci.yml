name: CI

on:
  push:
    branches: [main, feature/phase15-release]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Full test suite
        run: python -m pytest -q

      - name: Release smoke tests
        run: python -m pytest -q -m smoke

      - name: Deployment configuration check
        run: python -c "import tomllib,pathlib; c=tomllib.loads(pathlib.Path('.streamlit/config.toml').read_text(encoding='utf-8')); assert c['server']['headless'] is True; assert c['server']['maxUploadSize'] == 2; assert c['browser']['gatherUsageStats'] is False"
